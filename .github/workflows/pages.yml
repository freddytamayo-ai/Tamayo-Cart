# Deploy the static Tamayo Cart site to GitHub Pages.
# The live site is https://freddytamayo-ai.github.io/Tamayo-Cart/
# (project Pages, so the app must keep relative asset paths).
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish the site root, but leave tests/ (and VCS/workflow files) out of the artifact.
      # upload-pages-artifact@v3 includes dotfiles, so .nojekyll is deployed with the site.
      - name: Assemble site
        run: |
          mkdir -p _site
          tar --exclude=./tests --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -C _site -xf -
          test -f _site/index.html
          test -f _site/.nojekyll
          test ! -d _site/tests

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
